<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Étude Prix & Streaming musical</title>
<!--
ENREGISTREMENT DES RÉPONSES (Supabase) :
1. Créez la table avec le fichier creer-table-supabase.sql (Supabase > SQL Editor > Run).
2. Collez l’URL du projet dans SUPABASE_URL et la clé publishable dans SUPABASE_KEY (jamais la clé secrète).
Sans ces deux valeurs, la page tourne en mode test : les réponses s’affichent à l’écran.
-->
<style>
:root{--ink:#15132b;--paper:#f3f2f9;--line:#d6d3ea;--mut:#5b5875;--acc:#4638e8;--serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.top{background:var(--ink);color:#d9d6f5;padding:14px 24px;display:flex;justify-content:space-between;gap:12px;font-size:.9rem}
.top b{font:600 1.05rem var(--serif);color:#fff}
.wrap{max-width:960px;margin:0 auto;padding:36px 24px 72px;display:grid;grid-template-columns:190px 1fr;gap:56px}
.rail{position:sticky;top:28px;align-self:start;list-style:none;margin:0;padding:0}
.rail li{display:flex;gap:12px;align-items:center;padding:8px 0;color:var(--mut);font-size:.93rem}
.rail li:before{content:"";width:11px;height:11px;border-radius:50%;border:2px solid var(--line);flex:none;background:var(--paper)}
.rail .done:before{background:var(--acc);border-color:var(--acc)}
.rail .cur{color:var(--ink);font-weight:600}
.rail .cur:before{border-color:var(--acc)}
main{max-width:620px;min-width:0}
.mbar{display:none;margin-bottom:22px;font-size:.88rem;color:var(--mut)}
.mbar div{height:4px;background:var(--line);margin-top:6px;border-radius:2px;overflow:hidden}
.mbar i{display:block;height:100%;background:var(--acc)}
h1{font:600 2.1rem/1.15 var(--serif);letter-spacing:-.01em;margin:0 0 12px}
h1:focus{outline:none}
.lead{color:var(--mut);margin:0 0 26px}
p{margin:0 0 14px}
.mut{color:var(--mut);font-size:.92rem}
fieldset{border:0;margin:0;padding:20px 0;border-top:1px solid var(--line);min-width:0}
legend{padding:0;font-weight:600;margin-bottom:6px}
.hint{color:var(--mut);font-size:.9rem;margin:0 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chips label{position:relative}
.chips input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.chips span{display:block;padding:9px 15px;border:1.5px solid var(--line);border-radius:6px;background:#fff}
.chips input:checked+span{background:var(--ink);border-color:var(--ink);color:#fff}
.chips input:focus-visible+span{outline:3px solid var(--acc);outline-offset:2px}
.scale{flex-wrap:nowrap;margin-top:0}
.scale label{flex:1 1 0;min-width:0}
.scale span{text-align:center;padding:9px 0}
.mrow{display:flex;justify-content:space-between;align-items:center;gap:18px;padding:10px 0;border-bottom:1px solid var(--line)}
.mrow>span{flex:1}
.mrow .chips{flex:0 0 240px;margin:0}
.mrow.yn .chips{flex-basis:150px}
.eur{display:flex;align-items:baseline;gap:10px;margin-top:8px}
input[type=number]{width:150px;font:600 1.4rem var(--serif);padding:8px 12px;border:1.5px solid var(--line);border-radius:6px;color:var(--ink)}
input[type=number]:focus-visible,button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.chk{display:flex;gap:12px;align-items:flex-start;padding:6px 0}
.chk input{margin-top:6px;width:18px;height:18px;accent-color:var(--acc);flex:none}
.offer{background:var(--ink);color:#fff;border-radius:6px 22px 6px 22px;padding:24px 26px;margin:0 0 20px}
.offer h2{font:600 1.7rem var(--serif);margin:0}
.offer .sub{color:#b9b4ee;margin:2px 0 14px}
.offer ul{margin:0;padding-left:20px}
.offer li{margin-bottom:5px}
.offer .ref{margin:16px 0 0;padding-top:14px;border-top:1px solid #4a4676;color:#d9d6f5}
button{font:inherit;font-weight:600;color:#fff;background:var(--acc);border:0;border-radius:6px;padding:13px 28px;cursor:pointer;margin-top:18px}
pre{background:#fff;border:1px solid var(--line);padding:12px;border-radius:6px;overflow-x:auto;font-size:.8rem}
.lg{width:1em;height:1em;fill:currentColor;flex:none}
.mono{display:inline-flex;align-items:center;justify-content:center;width:1em;height:1em;border-radius:50%;background:var(--ink);color:#fff;font:700 .5em/1 system-ui;flex:none}
.hero{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 26px}
.hero span{display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:7px 14px 7px 10px;font-size:.92rem;font-weight:600}
.hero .lg,.hero .mono{font-size:22px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px;margin-top:10px}
.tiles label{position:relative}
.tiles input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.tiles span{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:96px;padding:14px 8px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;font-size:.92rem;text-align:center}
.tiles .lg,.tiles .mono{font-size:36px}
.tiles input:checked+span{border-color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink);background:#faf9ff;font-weight:600}
.tiles input:focus-visible+span{outline:3px solid var(--acc);outline-offset:2px}
.offer .brand{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.offer .brand .lg,.offer .brand .mono{font-size:42px}
.offer .ref{display:flex;align-items:center;gap:12px}
.offer .ref .lg{font-size:28px}
.legal{font-size:.8rem;color:var(--mut);margin-top:22px}
@media(max-width:760px){
.wrap{display:block;padding:20px 18px 56px}.rail{display:none}.mbar{display:block}
h1{font-size:1.7rem}.mrow{flex-direction:column;align-items:flex-start;gap:6px}.mrow .chips,.mrow.yn .chips{flex-basis:auto;width:100%}
}
</style>
</head>

const app = document.getElementById("app"), rail = document.getElementById("rail");
const ans = {};
let i = 0;

function send() {
  const rec = Object.assign({
    repondant: crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2),
    horodatage: new Date().toISOString(),
    version: VERSION
  }, ans, { duree_s: Math.round((Date.now() - t0) / 1000) });
  if (!SUPABASE_URL || !SUPABASE_KEY) return '<p class="mut">Mode test : Supabase n’est pas encore configuré. Voici ce qui serait envoyé.</p><pre>' + JSON.stringify(rec, null, 2) + "</pre>";
  post(rec);
  return '<p id="envoi">Envoi de vos réponses…</p>';
}

function post(rec) {
  const el = () => document.getElementById("envoi");
  fetch(SUPABASE_URL + "/rest/v1/reponses", {
    method: "POST",
    headers: { "Content-Type": "application/json", apikey: SUPABASE_KEY, Prefer: "return=minimal" },
    body: JSON.stringify(rec)
  }).then(r => {
    if (!r.ok) throw new Error(r.status);
    el().textContent = "Vos réponses ont bien été envoyées. Merci, vous pouvez fermer cette page.";
  }).catch(() => {
    el().innerHTML = 'L’envoi a échoué. Vérifiez votre connexion puis <button type="button" id="retry">réessayez</button>.';
    document.getElementById("retry").onclick = () => { el().textContent = "Envoi de vos réponses…"; post(rec); };
  });
}

function render(extra) {
  const s = S[i];
  rail.innerHTML = SECTIONS.map((t, k) => '<li class="' + (k < s.sec ? "done" : k === s.sec ? "cur" : "") + '">' + t + "</li>").join("");
  const pct = Math.round(i / (S.length - 1) * 100);
  app.innerHTML = '<div class="mbar">' + (SECTIONS[s.sec] || "") + '<div><i style="width:' + pct + '%"></i></div></div>' +
    '<form><h1 tabindex="-1">' + s.h + "</h1>" + (s.lead ? '<p class="lead">' + s.lead + "</p>" : "") +
    (s.end ? extra || "" : s.b + "<button>" + (s.btn || "Continuer") + "</button>") + "</form>";
  const f = app.querySelector("form");
  f.onsubmit = e => {
    e.preventDefault();
    if (s.end) return;
    Object.assign(ans, Object.fromEntries(new FormData(f)));
    if (i === 1 && ans.abonne === "Non") { // hors cible : fin sans enregistrement
      i = S.length - 1;
      return render("<p>Cette étude s’adresse aux personnes qui ont un abonnement payant à un service de streaming musical. Merci pour votre temps.</p>");
    }
    i++;
    render(i === S.length - 1 ? send() : "");
  };
  app.querySelector("h1").focus();
  window.scrollTo(0, 0);
}
render();
